[build]
  command = "npm run build"
  publish = ".next"

# IMPORTANT: Do NOT set NEXT_PUBLIC_* or secret env vars here.
# All environment variables (including Supabase URL/anon key, XAI_API_KEY, Stripe, etc.)
# MUST be set ONLY in the Netlify dashboard:
#   Site settings → Environment variables
# Setting them (even as "") in this [build.environment] section forces empty values
# at build time and prevents dashboard variables from working correctly.
# This was the root cause of the persistent "Supabase not configured" banner.
# After changing dashboard vars, always force a fresh build (dummy commit or Clear cache + redeploy).

# [build.environment] section removed for correct env var propagation from Netlify UI.

# Official Netlify Next.js plugin (install via Netlify UI Plugins tab)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Production security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# API routing (handled gracefully by the Next.js plugin)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
